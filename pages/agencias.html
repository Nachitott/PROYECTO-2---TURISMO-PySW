<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencias - Turismo Jujeño</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/agencias.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="py-5" style="min-height: 80vh; margin-top: 50px;">
        <div class="container mt-4">
            <h2 class="text-center fw-bold mb-5">Agencias Certificadas</h2>

            <div class="row g-4">
                
                <div class="col-md-4">
                    <div class="flip-container">
                        <div class="flipper">
                            
                            <div class="front text-center">
                                <i class="fa-solid fa-map-location-dot fa-4x text-primary mt-4"></i>
                                <h4 class="mt-3">Norte Aventura EVT</h4>
                                <p class="text-muted">Especialistas en turismo de alta montaña y expediciones en la Puna.</p>
                                <button class="btn btn-outline-primary btn-flip w-100 mt-auto">Ver Detalles <i class="fa-solid fa-rotate"></i></button>
                            </div>

                            <div class="back text-center">
                                <h5>Contacto</h5>
                                <p class="small mb-1"><i class="fa-solid fa-phone"></i> +54 9 388 123-4567</p>
                                <p class="small mb-3"><i class="fa-solid fa-envelope"></i> info@norteaventura.com</p>
                                
                                <h6>Calificá esta agencia:</h6>
                                <div class="star-rating mb-3">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                </div>
                                
                                <button class="btn btn-secondary btn-flip w-100 mt-auto">Volver <i class="fa-solid fa-rotate-left"></i></button>
                            </div>

                        </div>
                    </div>
                </div>
                
                </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
</body>
</html>
