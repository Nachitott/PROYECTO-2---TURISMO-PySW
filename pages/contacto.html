<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Turismo Jujeño</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="py-5 bg-light" style="margin-top: 80px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow border-0 p-4">
                        <h2 class="text-center fw-bold mb-4">Envianos tu consulta</h2>
                        
                        <form id="form-contacto" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre completo</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                                    <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                                    <div class="invalid-feedback">Ingresá un correo electrónico válido.</div>
                                </div>

                                <div class="col-12">
                                    <label for="mensaje" class="form-label">Tu mensaje</label>
                                    <textarea class="form-control" id="mensaje" rows="4" required></textarea>
                                    <div class="invalid-feedback">El mensaje no puede estar vacío.</div>
                                </div>

                                <div class="col-12 text-center mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg w-100" id="btn-enviar">
                                        <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                                        <span id="btn-text">Enviar Mensaje</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="modal-body">
                    <i class="fa-solid fa-circle-check text-success fa-4x mb-3"></i>
                    <h3>¡Mensaje Enviado!</h3>
                    <p>Gracias por contactarnos. Te responderemos a la brevedad.</p>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
</body>
</html>
